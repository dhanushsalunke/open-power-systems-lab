[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-power-systems-lab"
version = "0.2.0"
description = "Reproducible power-electronics modelling, control, fault analysis, and HIL interfaces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
analysis = ["scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.8", "mypy>=1.11"]

[project.scripts]
opl = "open_power_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
