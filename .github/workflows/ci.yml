name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev,analysis]'
      - run: pytest -q
      - run: python -m open_power_lab run --config configs/baseline.yaml --output results/ci
