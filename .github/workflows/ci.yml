name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m ruff format --check src tests
      - run: python -m ruff check src tests --select E,F --ignore E501
      - run: python -m mypy src --ignore-missing-imports --follow-imports=skip
      - run: python -m compileall -q src tests
      - run: pytest -q
      - run: python -m open_power_lab validate --config configs/baseline.yaml
      - run: python -m open_power_lab run --config configs/baseline.yaml --output results/ci
      - run: python -m open_power_lab sweep --config configs/baseline.yaml --parameter load_resistance_ohm --values 4,5 --output results/ci-sweep.csv
